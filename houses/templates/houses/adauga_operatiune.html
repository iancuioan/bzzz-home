{% extends 'base.html' %}
{% load static %}
{% block title %}Contabil{% endblock %}

{% block content %}
<div class="container py-5">
  <h2 class="mb-4">➕ Adaugă operațiune contabilă</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">💾 Salvează</button>
    <a href="{% url 'lista_operatiuni' %}" class="btn btn-secondary ms-2">🔙 Înapoi</a>
  </form>
</div>
{% endblock %}
