{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <h2>Confirmare  stergere deplasare in pastoral</h2>
  <p>Ești sigur că vrei să ștergi: <strong>{{ pastoral }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" style="background-color: red; color: white;">Da, șterge</button>
    <a href="{% url 'pastoral_view' %}">Anulează</a>
  </form>
</div>
{% endblock %}
