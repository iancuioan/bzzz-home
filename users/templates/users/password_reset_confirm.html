{% extends 'base.html' %}
{% load form_filters %}

{% block title %}Resetare parolă{% endblock %}

{% block content %}
<div class="container py-5">
  <h2>Setează o parolă nouă </h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Salvează parola</button>
  </form>
</div>
{% endblock %}
