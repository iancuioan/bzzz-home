{% extends 'base.html' %}
{% load form_filters %}
{% block title %}Resetare parolă{% endblock %}

{% block content %}
<div class="container py-5">
  <h2>Ai uitat parola?</h2>
  <p>Introdu adresa ta de email și îți vom trimite un link pentru a reseta parola.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }} {{ form.email }}
    <button type="submit" class="btn btn-primary mt-3">Trimite linkul de resetare</button>
  </form>
</div>
{% endblock %}
