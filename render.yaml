services:
  - type: web
    name: bzzz-home
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn bzzz_home.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: bzzz-home-db
          property: connectionString

databases:
  - name: bzzz-home-db
    plan: free
